name = "streamflix-api"
main = "worker.ts"
compatibility_date = "2025-06-01"

[observability]
enabled = true

[vars]
SUPABASE_URL = "https://your-project.supabase.co"
# Origines autorisées (CORS), séparées par des virgules. "*" = toutes.
ALLOWED_ORIGINS = "*"

# Vidéos (source_type = 'r2') et miniatures uploadées depuis l'admin (préfixe thumbnails/)
[[r2_buckets]]
binding = "VIDEOS"
bucket_name = "streamflix-videos"

# Secrets à ajouter via `wrangler secret put <NOM>` :
#   SUPABASE_SERVICE_ROLE_KEY
#   GOOGLE_DRIVE_API_KEY   (optionnel, pour les vidéos Google Drive)
